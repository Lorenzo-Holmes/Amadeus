[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amadeus-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=7.4,<9"]

[project.scripts]
amadeus-stage0a = "tools.stage0a_sources.cli:main"
amadeus-stage0b = "tools.stage0b_adjudication.cli:main"
amadeus-project-kb = "tools.project_kb.cli:main"

[tool.setuptools.packages.find]
where = [".", "src"]
include = ["tools*", "amadeus_core*"]

[tool.setuptools.package-data]
amadeus_core = ["contracts/*.json", "contracts/*.txt", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
